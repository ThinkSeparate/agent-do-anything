mode: permissive

# 命令分类：增量定义（严格 ⊂ 标准 ⊂ 宽松）
command_categories:
  file_view:
    name: 文件查看
    strict: [ls, dir, cat, head, tail, echo, pwd, cd]
    normal: [find, grep, sort, uniq, wc]
    permissive: [locate, where, tree, stat, file]

  python_pip:
    name: Python/pip
    strict: ["python --version", "python -V", "python --help", "pip list", "pip show", "pip freeze", "pip help", "pip --version", "pip -V"]
    normal: [python, "python *.py", "pip install"]
    permissive: ["python -c", "python -m", "pip install --upgrade", "pip install --user"]

  java:
    name: Java
    strict: ["java -version", "javac -version", "java --help", "javac --help"]
    normal: [java, javac, "java *.java"]
    permissive: ["java -jar", "javac -d", "java -cp"]

  git:
    name: Git操作
    strict: ["git status", "git log", "git diff", "git branch", "git remote -v"]
    normal: ["git add", "git commit", "git push", "git pull", "git fetch", "git clone", "git remote"]
    permissive: ["git checkout", "git merge", "git rebase", "git reset", "git revert", "git stash"]

  file_ops:
    name: 文件操作
    strict: [mkdir, rmdir, touch, cp, mv, copy, move]
    normal: [rm, del, xcopy, robocopy]
    permissive: [tar, zip, unzip, "7z", gzip]

  network:
    name: 网络命令
    strict: [ping, ipconfig, ifconfig, netstat]
    normal: [curl, wget, nslookup, dig, traceroute, whois]
    permissive: [ssh, scp, sftp, ftp, telnet, nc]

  dangerous:
    name: 危险命令
    strict: []
    normal: []
    permissive: []
    forbidden: [mkfs, fdisk, dd, format, regedit, diskpart, sudo, su, "chmod 777", "chown root", "kill -9", shutdown, reboot, "rm -rf /"]

# 目录限制
allowed_directories:
- ${PROJECT_DIR}
- ${PROJECT_DIR}/agent_output
- ${PROJECT_DIR}/temp

forbidden_directories:
- C:/Windows
- C:/Program Files
- C:/ProgramData
- /etc
- /usr/bin
- /bin
- ~/.ssh
- ~/.aws
- ~/.config

# 超时设置
timeouts:
  default: 30
  long_running: 300
  network: 60

# 资源限制
resource_limits:
  max_memory_mb: 2048
  max_cpu_percent: 80
  max_disk_read_mb: 100
  max_disk_write_mb: 100
