# config.yaml
model:
  api_key: "sk-xxxxxxxxxxxxxxxxxxxx"  # 您的真实API密钥（注意：将敏感信息直接放在YAML中需确保文件安全）
  base_url: "https://api.deepseek.com/v1"
  name: "deepseek-reasoner"
  timeout: 120
  context_limit: 128000  # 模型上下文长度限制（单位：token）
  warn_threshold: 0.8     # 模型上下文使用超过0.8开始告警
  truncate_threshold: 0.9 # 模型上下文使用超过0.9开始截断
  context_compress_threshold: 100000  # 触发上下文压缩的阈值

agent:
  output_root: "agent_output"

